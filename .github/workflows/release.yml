name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pages: write

# dva releasy naraz by si prepisovali vetvu gh-pages
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: python -m pytest -q
      - name: Zabaliť doplnok a repozitár
        id: build
        run: |
          echo "zip=$(python dev/build_zip.py --check "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"
          echo "repo_zip=$(python dev/build_zip.py --addon repository.tvadovic)" >> "$GITHUB_OUTPUT"
      - name: Vytvoriť release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.build.outputs.zip }}" --title "$GITHUB_REF_NAME" --generate-notes

      # Kodi repozitár na GitHub Pages (https://tvadovic.github.io/plugin.video.stvr/)
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
      - name: Aktualizovať Kodi repozitár
        run: python dev/build_repo.py "${{ steps.build.outputs.zip }}" "${{ steps.build.outputs.repo_zip }}" --out gh-pages
      - name: Pushnúť gh-pages
        working-directory: gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Repozitár bez zmien"; exit 0; fi
          git commit -m "Kodi repozitár: $GITHUB_REF_NAME"
          git push
      - name: Spustiť build GitHub Pages
        # push cez GITHUB_TOKEN build zvyčajne spustí sám; toto je poistka
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
